name: Lego Bin
options:
  bundleIdPrefix: com.shimondeitel.legobin
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "W7Q885Q59C"
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
targets:
  Lego Bin:
    type: application
    platform: iOS
    sources:
      - path: Lego Bin
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.legobin
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Lego Bin/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
  Lego BinTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Lego BinTests
      - path: Lego Bin.storekit
    dependencies:
      - target: Lego Bin
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.legobin.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
  Lego BinUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Lego BinUITests
    dependencies:
      - target: Lego Bin
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.legobin.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  Lego Bin:
    build:
      targets:
        Lego Bin: all
        Lego BinTests: [test]
        Lego BinUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: Lego Bin.storekit
    test:
      config: Debug
      storeKitConfiguration: Lego Bin.storekit
      targets:
        - Lego BinTests
        - Lego BinUITests
    archive:
      config: Release
